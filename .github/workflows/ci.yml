name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.19"
  PYTHON_VERSION: "3.12"   # lowest version pyproject.toml allows (requires-python >=3.12,<3.15)
  RUFF_VERSION: "0.15.12"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run_tests:
              - 'creation/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'

  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          cache: true
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group test
      - name: Run tests
        timeout-minutes: 25
        run: uv run --frozen --group test pytest tests -q -rs --durations=15

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff check
        run: uvx ruff@${{ env.RUFF_VERSION }} check creation tests
      - name: ruff format --check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check creation tests

  skill-copies:
    name: skill-copies
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skill copies are identical (.claude vs .cursor)
        run: |
          status=0
          for skill in episode-production trend-lab-original-story; do
            for f in SKILL.md reference.md; do
              a=".claude/skills/$skill/$f"
              b=".cursor/skills/$skill/$f"
              if [ ! -f "$a" ] || [ ! -f "$b" ]; then
                echo "::error file=$b::missing $skill/$f in one of .claude or .cursor"
                status=1
                continue
              fi
              if ! diff -u "$a" "$b"; then
                echo "::error file=$b::$b differs from $a; the two skill copies must stay identical"
                status=1
              fi
            done
          done
          exit $status

  all-checks:
    name: All checks passed
    if: always()
    needs: [changes, tests, lint, skill-copies]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more checks did not pass"
            exit 1
          fi
