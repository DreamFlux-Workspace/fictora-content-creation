<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fictora Content Creation</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <h1 style="font-size: 3rem; line-height: 1.05">Fictora Content Creation</h1>
      <p class="lede" style="font-size: 0.875rem">Hosted Drama API only. Prompts and compilers stay on the server.</p>
      <p id="config-line" class="meta"></p>
    </header>

    <main>
      <section class="panel">
        <h2>New series</h2>
        <form id="create-form">
          <label>Title <input name="title" required placeholder="Old Man Breach" /></label>
          <label>Premise <textarea name="prompt" required rows="4" placeholder="One-line premise and visual lock…"></textarea></label>
          <label>Band
            <select name="band">
              <option value="15s" selected>15s</option>
              <option value="30s">30s</option>
              <option value="60s">60s</option>
            </select>
          </label>
          <label>Preset id <input name="preset_id" placeholder="modern-dark-fantasy" /></label>
          <label>Video lane <input name="video_lane" value="minimax-h3" /></label>
          <button type="submit">Start draft (API)</button>
        </form>
      </section>

      <section class="panel">
        <h2>Active desk</h2>
        <p id="desk-id" class="meta">No desk selected.</p>
        <div id="gates" class="gates"></div>
        <div id="exposure" class="block"></div>
        <div id="estimate" class="block"></div>
        <div id="media" class="media-grid"></div>
        <div id="delivery" class="block"></div>
        <pre id="status" class="status"></pre>
      </section>

      <section class="panel">
        <h2>Recent desks</h2>
        <ul id="desk-list"></ul>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
