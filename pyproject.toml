[project]
name = "fictora-content-creation"
version = "0.2.0"
description = "Hosted Drama API harness, desk ops CLI, and Cursor skill — no prompts or service code."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28",
  "pillow>=10.0",
]

[project.scripts]
fictora-ops = "creation.cli_ops:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creation"]

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
