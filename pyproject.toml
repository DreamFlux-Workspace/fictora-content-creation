[project]
name = "fictora-content-creation"
version = "0.1.0"
description = "Public creation layer — Content Desk UI and BFF for the hosted Drama Generation API."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.136",
  "httpx>=0.28",
  "pydantic>=2.7",
  "pydantic-settings>=2.14",
  "uvicorn>=0.46",
]

[project.scripts]
content-desk = "content_desk.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["content_desk"]

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
